<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discography Tracker - Slop Library</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --muted: #a6a6a6;
            --text: #e8e8e8;
            --accent: #ffcc00;
            --ok: #3fd27f;
            --todo: #7aa8ff;
            --missing: #555;
            --danger: #ff6969;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }
        .top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.4px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            border: 1px solid #3a3a3a;
            background: #1a1a1a;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .search {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            color: var(--text);
            border-radius: 8px;
            padding: 8px 10px;
            min-width: 240px;
        }
        .hint {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 14px;
        }
        .msg {
            background: #221616;
            border: 1px solid #5a2d2d;
            color: #ffd0d0;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }
        .row {
            background: var(--card);
            border: 1px solid #2f2f2f;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .row-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .artist {
            font-weight: 700;
            color: var(--accent);
        }
        .artist-meta {
            color: var(--muted);
            font-size: 0.88rem;
        }
        .totals-edit {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.86rem;
        }
        .totals-edit input {
            width: 64px;
            background: #151515;
            border: 1px solid #333;
            color: var(--text);
            border-radius: 6px;
            padding: 5px 6px;
            text-align: center;
        }
        .save-mini {
            background: #182218;
            border: 1px solid #2f4f2f;
            color: #c7f4c7;
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .blocks {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .block {
            min-width: 62px;
            height: 62px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 1px solid #333;
            color: #f4f4f4;
            font-size: 0.8rem;
            user-select: none;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .block.clickable {
            cursor: pointer;
        }
        .block.clickable:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(255, 204, 0, 0.35) inset;
        }
        .block.library {
            background-color: #222;
            border-color: #575757;
        }
        .block.todo {
            background-color: #1c2538;
            border-color: #5d78b3;
            color: #d6e4ff;
        }
        .block.todo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(135deg, rgba(122, 168, 255, 0.24) 0 6px, rgba(60, 80, 130, 0.1) 6px 12px);
            pointer-events: none;
        }
        .block.missing {
            background: rgba(90, 90, 90, 0.2);
            border-color: var(--missing);
            color: #d2d2d2;
            cursor: pointer;
        }
        .block.missing:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .block-index {
            position: absolute;
            top: 3px;
            right: 4px;
            font-size: 0.56rem;
            line-height: 1;
            padding: 2px 3px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f0f0f0;
            z-index: 2;
        }
        .block-symbol {
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 10px 0 16px 0;
            color: var(--muted);
            font-size: 0.86rem;
        }
        .legend i {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
            border: 1px solid #444;
        }
        .lg-lib { background: #2a2a2a; }
        .lg-todo { background: repeating-linear-gradient(135deg, rgba(122, 168, 255, 0.26) 0 4px, rgba(60, 80, 130, 0.12) 4px 8px); }
        .lg-miss { background: rgba(90, 90, 90, 0.2); }
        .muted { color: var(--muted); }
        .ok { color: var(--ok); }
        .danger { color: var(--danger); }
        @media (max-width: 760px) {
            .block { min-width: 50px; height: 50px; font-size: 0.72rem; }
            .search { min-width: 180px; }
            .totals-edit { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <h1>Discography Tracker</h1>
            <div class="top-actions">
                <input class="search" id="searchArtist" placeholder="Artist search...">
                <button class="btn" id="btnReload">Refresh</button>
                <button class="btn" id="btnBack">Back to app</button>
            </div>
        </div>

        <div class="hint">Each row combines Library and ToDo by artist. Missing blocks (?) jump back to ToDo add form with artist prefilled.</div>
        <div class="legend">
            <span><i class="lg-lib"></i>Library</span>
            <span><i class="lg-todo"></i>ToDo</span>
            <span><i class="lg-miss"></i>Missing (?)</span>
        </div>

        <div class="msg" id="errorBox"></div>
        <div id="metaLine" class="hint"></div>
        <div id="listRoot"></div>
    </div>

    <script type="module">
        import { db, storage, doc, getDoc, setDoc, ref, getDownloadURL } from "./src/core/firebase.js";

        const root = document.getElementById("listRoot");
        const errorBox = document.getElementById("errorBox");
        const metaLine = document.getElementById("metaLine");
        const searchInput = document.getElementById("searchArtist");
        const state = {
            albums: [],
            todos: [],
            artistTotals: {},
            grouped: []
        };

        const normalizeArtist = (v) => String(v || "").trim();
        const normalizeAlbum = (v) => String(v || "").trim().toLowerCase();
        const numericYear = (y) => {
            const n = parseInt(String(y || "").trim(), 10);
            return Number.isFinite(n) ? n : 99999;
        };

        function showError(msg) {
            errorBox.style.display = "block";
            errorBox.innerText = msg;
        }

        function clearError() {
            errorBox.style.display = "none";
            errorBox.innerText = "";
        }

        async function loadData() {
            clearError();
            let data = null;
            try {
                const snap = await getDoc(doc(db, "data", "library"));
                if (snap.exists()) data = snap.data();
            } catch (e) {
                console.warn("Firestore read failed:", e);
            }

            if (!data) {
                try {
                    const publicRef = ref(storage, "public/library.json");
                    const url = await getDownloadURL(publicRef);
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error("Public JSON not reachable");
                    data = await resp.json();
                } catch (e) {
                    console.error(e);
                    showError("Could not load discography data from Firestore or public mirror.");
                    return;
                }
            }

            state.albums = Array.isArray(data.albums) ? data.albums : [];
            state.todos = Array.isArray(data.todos) ? data.todos : [];
            state.artistTotals = data.artistTotals && typeof data.artistTotals === "object" ? data.artistTotals : {};
            buildGrouped();
            render();
        }

        function buildGrouped() {
            const byArtist = new Map();

            const pushRecord = (artistRaw, record) => {
                const artist = normalizeArtist(artistRaw);
                if (!artist) return;
                if (!byArtist.has(artist)) {
                    byArtist.set(artist, {
                        artist,
                        library: [],
                        todo: [],
                        totalAlbumsCount: 0
                    });
                }
                const item = byArtist.get(artist);
                const target = record.source === "library" ? item.library : item.todo;
                target.push(record);
            };

            state.albums.forEach((a) => {
                pushRecord(a.artist, {
                    source: "library",
                    album: String(a.album || ""),
                    year: numericYear(a.year),
                    coverUrl: String(a.coverUrl || "")
                });
            });

            state.todos.forEach((t) => {
                pushRecord(t.artist, {
                    source: "todo",
                    album: String(t.album || ""),
                    year: numericYear(t.year),
                    coverUrl: String(t.coverUrl || "")
                });
            });

            Object.entries(state.artistTotals || {}).forEach(([artistRaw]) => {
                const artist = normalizeArtist(artistRaw);
                if (!artist) return;
                if (!byArtist.has(artist)) {
                    byArtist.set(artist, {
                        artist,
                        library: [],
                        todo: [],
                        totalAlbumsCount: 0
                    });
                }
            });

            const grouped = [];
            byArtist.forEach((entry, artist) => {
                const dedupe = new Map();

                entry.library.forEach((r) => {
                    const key = `${normalizeAlbum(r.album)}__${r.year}`;
                    dedupe.set(key, { ...r, source: "library" });
                });

                entry.todo.forEach((r) => {
                    const key = `${normalizeAlbum(r.album)}__${r.year}`;
                    if (!dedupe.has(key)) dedupe.set(key, { ...r, source: "todo" });
                });

                const known = [...dedupe.values()].sort((a, b) => a.year - b.year);
                const libCount = known.filter((x) => x.source === "library").length;
                const todoCount = known.filter((x) => x.source === "todo").length;
                const storedTotal = parseInt(state.artistTotals[artist], 10);
                const knownCount = known.length;
                const totalAlbumsCount = Number.isFinite(storedTotal) && storedTotal >= 0 ? storedTotal : 0;
                const missingCount = totalAlbumsCount > 0 ? Math.max(0, totalAlbumsCount - knownCount) : 0;
                const isIncomplete = totalAlbumsCount === 0 || todoCount > 0 || missingCount > 0;

                grouped.push({
                    artist,
                    known,
                    libCount,
                    todoCount,
                    totalAlbumsCount,
                    missingCount,
                    isIncomplete
                });
            });

            grouped.sort((a, b) => a.artist.localeCompare(b.artist, "hu"));
            state.grouped = grouped;
        }

        function blockTitle(block, idx) {
            if (block.source === "library") return `${idx + 1}. ${block.album || "Unknown"} (${block.year === 99999 ? "?" : block.year}) [Library]`;
            if (block.source === "todo") return `${idx + 1}. ${block.album || "Unknown"} (${block.year === 99999 ? "?" : block.year}) [ToDo]`;
            return `${idx + 1}. Missing album`;
        }

        function goToTodoAdd(artist) {
            const params = new URLSearchParams();
            params.set("page", "todo");
            params.set("openAddTodo", "1");
            params.set("artist", artist);
            window.location.href = `./index.html?${params.toString()}`;
        }

        function goToLibraryAlbum(artist, album) {
            const params = new URLSearchParams();
            params.set("page", "library");
            params.set("libraryArtist", artist || "");
            params.set("libraryAlbum", album || "");
            window.location.href = `./index.html?${params.toString()}`;
        }

        function goToTodoAlbum(artist, album) {
            const params = new URLSearchParams();
            params.set("page", "todo");
            params.set("todoQuery", `${artist} ${album}`.trim());
            window.location.href = `./index.html?${params.toString()}`;
        }

        async function saveArtistTotal(artist, value) {
            const n = parseInt(String(value || "").trim(), 10);
            if (!Number.isFinite(n) || n < 0) {
                alert("Total albums must be a non-negative number.");
                return;
            }

            const nextTotals = { ...(state.artistTotals || {}) };
            nextTotals[artist] = n;

            try {
                const payload = {
                    albums: state.albums,
                    todos: state.todos,
                    artistTotals: nextTotals
                };
                await setDoc(doc(db, "data", "library"), payload, { merge: true });
                state.artistTotals = nextTotals;
                buildGrouped();
                render();
            } catch (e) {
                console.error(e);
                alert("Could not save total albums count.");
            }
        }

        function render() {
            const q = String(searchInput.value || "").trim().toLowerCase();
            const rows = q ? state.grouped.filter((g) => g.artist.toLowerCase().includes(q)) : state.grouped;

            const completed = state.grouped.filter((g) => g.totalAlbumsCount > 0 && g.libCount === g.totalAlbumsCount && g.todoCount === 0).length;
            const withMissing = state.grouped.filter((g) => g.missingCount > 0).length;
            const incomplete = state.grouped.filter((g) => g.isIncomplete).length;
            metaLine.innerHTML = `Artists: <strong>${state.grouped.length}</strong> | <span class="ok">Completed: ${completed}</span> | <span class="danger">Incomplete: ${incomplete}</span> | <span class="danger">With missing: ${withMissing}</span>`;

            if (!rows.length) {
                root.innerHTML = '<div class="row muted">No artist matches the current filter.</div>';
                return;
            }

            root.innerHTML = rows
                .map((g) => {
                    const blocks = [];
                    g.known.forEach((k, i) => {
                        const cls = k.source === "library" ? "library" : "todo";
                        const coverStyle = k.coverUrl
                            ? `style="background-image: linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)), url('${k.coverUrl.replace(/'/g, "%27")}');"`
                            : "";
                        blocks.push(`<div class="block ${cls} clickable" data-source="${k.source}" data-artist="${encodeURIComponent(g.artist)}" data-album="${encodeURIComponent(k.album || "")}" title="${blockTitle(k, i)}" ${coverStyle}><span class="block-index">${i + 1}</span></div>`);
                    });
                    for (let i = 0; i < g.missingCount; i++) {
                        const idx = g.known.length + i;
                        blocks.push(`<div class="block missing" data-artist="${encodeURIComponent(g.artist)}" title="${blockTitle({ source: "missing" }, idx)}"><span class="block-index">${idx + 1}</span><span class="block-symbol">?</span></div>`);
                    }

                    return `
                    <div class="row">
                        <div class="row-head">
                            <div>
                                <div class="artist">${g.artist} (${g.totalAlbumsCount} albums)</div>
                                <div class="artist-meta">Library: ${g.libCount} | ToDo: ${g.todoCount} | Missing: ${g.missingCount} | Status: ${g.isIncomplete ? '<span class="danger">Incomplete</span>' : '<span class="ok">Complete</span>'}</div>
                            </div>
                            <div class="totals-edit">
                                <span>Total albums:</span>
                                <input type="number" min="0" value="${g.totalAlbumsCount}" data-total-input="${encodeURIComponent(g.artist)}">
                                <button class="save-mini" data-save-total="${encodeURIComponent(g.artist)}">Save</button>
                            </div>
                        </div>
                        <div class="blocks">${blocks.join("")}</div>
                    </div>`;
                })
                .join("");

            root.querySelectorAll(".block.missing").forEach((el) => {
                el.addEventListener("click", () => {
                    const artist = decodeURIComponent(el.getAttribute("data-artist") || "");
                    goToTodoAdd(artist);
                });
            });

            root.querySelectorAll(".block.clickable").forEach((el) => {
                el.addEventListener("click", () => {
                    const source = el.getAttribute("data-source") || "";
                    const artist = decodeURIComponent(el.getAttribute("data-artist") || "");
                    const album = decodeURIComponent(el.getAttribute("data-album") || "");
                    if (source === "todo") {
                        goToTodoAlbum(artist, album);
                    } else {
                        goToLibraryAlbum(artist, album);
                    }
                });
            });

            root.querySelectorAll("[data-save-total]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const encodedArtist = btn.getAttribute("data-save-total") || "";
                    const artist = decodeURIComponent(encodedArtist);
                    const input = root.querySelector(`[data-total-input="${encodedArtist}"]`);
                    const value = input ? input.value : "";
                    saveArtistTotal(artist, value);
                });
            });
        }

        document.getElementById("btnBack").addEventListener("click", () => {
            window.location.href = "./index.html";
        });

        document.getElementById("btnReload").addEventListener("click", () => {
            loadData();
        });

        searchInput.addEventListener("input", render);

        loadData();
    </script>
</body>
</html>
