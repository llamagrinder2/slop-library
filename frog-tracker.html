<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog tracker - Slop Library</title>
    <link rel="icon" type="image/svg+xml" href="./frog-favicon-green.svg">
    <style>
        :root {
            --bg: #0f1510;
            --card: #172019;
            --muted: #a6b7a8;
            --text: #e7f0e8;
            --accent: #39d353;
            --ok: #5fe37a;
            --todo: #8bc9ff;
            --missing: #55605a;
            --danger: #ff7b7b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            background-image: url("./froggg.svg");
            background-repeat: repeat;
            background-size: 128px 128px;
            background-position: 0 0;
            transform: rotate(45deg) scale(1.2);
            transform-origin: center center;
            opacity: 0.06;
            filter: brightness(0) saturate(100%) invert(57%) sepia(60%) saturate(585%) hue-rotate(76deg) brightness(92%) contrast(90%);
            pointer-events: none;
            z-index: 0;
        }
        .wrap {
            position: relative;
            z-index: 1;
        }
        .wrap {
            max-width: 1500px;
            margin: 0 auto;
            padding: 20px;
        }
        .top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.4px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            border: 1px solid #315238;
            background: #132016;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .hint {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 14px;
        }
        .msg {
            background: #261818;
            border: 1px solid #5a2d2d;
            color: #ffd0d0;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }
        .row {
            background: var(--card);
            border: 1px solid #27412c;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .row-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .artist {
            font-weight: 700;
            color: var(--accent);
        }
        .artist-meta {
            color: var(--muted);
            font-size: 0.88rem;
        }
        .completion-counter {
            color: var(--ok);
            font-weight: 800;
        }
        .totals-edit {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.86rem;
        }
        .totals-edit input {
            width: 80px;
            background: #101812;
            border: 1px solid #36533d;
            color: var(--text);
            border-radius: 6px;
            padding: 5px 6px;
            text-align: center;
        }
        .save-mini {
            background: #102513;
            border: 1px solid #2d6a38;
            color: #cbf7d3;
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .blocks {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            overflow-x: visible;
            padding-bottom: 2px;
        }
        .block {
            min-width: 58px;
            height: 58px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 1px solid #3a4c3f;
            color: #f4f4f4;
            font-size: 0.8rem;
            user-select: none;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .block.clickable {
            cursor: pointer;
        }
        .block.clickable:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(57, 211, 83, 0.35) inset;
        }
        .block.library {
            background-color: #1f2a22;
            border-color: #4f6654;
        }
        .block.todo {
            background-color: #1b2632;
            border-color: #547aa7;
            color: #dcecff;
        }
        .block.todo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(135deg, rgba(139, 201, 255, 0.24) 0 6px, rgba(65, 95, 140, 0.1) 6px 12px);
            pointer-events: none;
        }
        .block.missing {
            background: rgba(85, 96, 90, 0.25);
            border-color: var(--missing);
            color: #d2d2d2;
            cursor: pointer;
        }
        .block.missing:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .block-index {
            position: absolute;
            top: 3px;
            right: 4px;
            font-size: 0.56rem;
            line-height: 1;
            padding: 2px 3px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f0f0f0;
            z-index: 2;
        }
        .block-symbol {
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 10px 0 16px 0;
            color: var(--muted);
            font-size: 0.86rem;
        }
        .legend i {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
            border: 1px solid #444;
        }
        .lg-lib { background: #253128; }
        .lg-todo { background: repeating-linear-gradient(135deg, rgba(139, 201, 255, 0.26) 0 4px, rgba(65, 95, 140, 0.12) 4px 8px); }
        .lg-miss { background: rgba(85, 96, 90, 0.25); }
        .muted { color: var(--muted); }
        .ok { color: var(--ok); }
        .danger { color: var(--danger); }
        @media (max-width: 760px) {
            .block { min-width: 48px; height: 48px; font-size: 0.72rem; }
            .totals-edit { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <h1>Frog tracker</h1>
            <div class="top-actions">
                <a class="btn btn-link" href="https://phyllomedusa.bandcamp.com" target="_blank" rel="noopener noreferrer">Bandcamp</a>
                <a class="btn btn-link" href="https://rateyourmusic.com/artist/phyllomedusa" target="_blank" rel="noopener noreferrer">RYM</a>
                <button class="btn" id="btnReload">Refresh</button>
                <button class="btn" id="btnBackDiscog">Back to discography</button>
                <button class="btn" id="btnBackApp">Back to app</button>
            </div>
        </div>

        <div class="hint">Hypyractyv Larynx Frogquencies gyűjtemény</div>
        <div class="legend">
            <span><i class="lg-lib"></i>Library</span>
            <span><i class="lg-todo"></i>ToDo</span>
            <span><i class="lg-miss"></i>Missing (?)</span>
        </div>

        <div class="msg" id="errorBox"></div>
        <div id="metaLine" class="hint"></div>
        <div id="listRoot"></div>
    </div>

    <script type="module">
        import { db, storage, doc, getDoc, setDoc, ref, getDownloadURL } from "./src/core/firebase.js";

        const PHYLLOMEDUSA_ARTIST = "Phyllomedusa";
        const root = document.getElementById("listRoot");
        const errorBox = document.getElementById("errorBox");
        const metaLine = document.getElementById("metaLine");
        const state = {
            albums: [],
            todos: [],
            artistTotals: {},
            entry: null
        };

        const normalizeArtist = (v) => String(v || "").trim();
        const normalizeAlbum = (v) => String(v || "").trim().toLowerCase();
        const numericYear = (y) => {
            const n = parseInt(String(y || "").trim(), 10);
            return Number.isFinite(n) ? n : 99999;
        };

        const parseLengthToSeconds = (value) => {
            const raw = String(value || "").trim();
            if (!raw || raw === "?" || raw === "-") return null;

            if (/^\d+$/.test(raw)) {
                return parseInt(raw, 10) * 60;
            }

            const parts = raw.split(":").map((p) => p.trim());
            if (parts.length === 2) {
                const minutes = parseInt(parts[0], 10);
                const seconds = parseInt(parts[1], 10);
                if (!Number.isFinite(minutes) || !Number.isFinite(seconds) || seconds < 0 || seconds > 59) return null;
                return minutes * 60 + seconds;
            }

            if (parts.length === 3) {
                const hours = parseInt(parts[0], 10);
                const minutes = parseInt(parts[1], 10);
                const seconds = parseInt(parts[2], 10);
                if (!Number.isFinite(hours) || !Number.isFinite(minutes) || !Number.isFinite(seconds) || minutes < 0 || minutes > 59 || seconds < 0 || seconds > 59) return null;
                return hours * 3600 + minutes * 60 + seconds;
            }

            return null;
        };

        const formatDuration = (seconds) => {
            const s = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
            const hours = Math.floor(s / 3600);
            const minutes = Math.floor((s % 3600) / 60);
            const secs = s % 60;

            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
            }

            return `${minutes}:${String(secs).padStart(2, "0")}`;
        };

        function isPhyllomedusa(artist) {
            return normalizeArtist(artist).toLowerCase() === PHYLLOMEDUSA_ARTIST.toLowerCase();
        }

        function showError(msg) {
            errorBox.style.display = "block";
            errorBox.innerText = msg;
        }

        function clearError() {
            errorBox.style.display = "none";
            errorBox.innerText = "";
        }

        async function loadData() {
            clearError();
            let data = null;
            try {
                const snap = await getDoc(doc(db, "data", "library"));
                if (snap.exists()) data = snap.data();
            } catch (e) {
                console.warn("Firestore read failed:", e);
            }

            if (!data) {
                try {
                    const publicRef = ref(storage, "public/library.json");
                    const url = await getDownloadURL(publicRef);
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error("Public JSON not reachable");
                    data = await resp.json();
                } catch (e) {
                    console.error(e);
                    showError("Could not load frog tracker data from Firestore or public mirror.");
                    return;
                }
            }

            state.albums = Array.isArray(data.albums) ? data.albums : [];
            state.todos = Array.isArray(data.todos) ? data.todos : [];
            state.artistTotals = data.artistTotals && typeof data.artistTotals === "object" ? data.artistTotals : {};
            buildEntry();
            render();
        }

        function buildEntry() {
            const library = state.albums
                .filter((a) => isPhyllomedusa(a.artist))
                .map((a) => ({
                    source: "library",
                    album: String(a.album || ""),
                    year: numericYear(a.year),
                    coverUrl: String(a.coverUrl || ""),
                    length: String(a.length || "")
                }));

            const todo = state.todos
                .filter((t) => isPhyllomedusa(t.artist))
                .map((t) => ({
                    source: "todo",
                    album: String(t.album || ""),
                    year: numericYear(t.year),
                    coverUrl: String(t.coverUrl || ""),
                    length: String(t.length || "")
                }));

            const dedupe = new Map();
            library.forEach((r) => {
                const key = `${normalizeAlbum(r.album)}__${r.year}`;
                dedupe.set(key, { ...r, source: "library" });
            });
            todo.forEach((r) => {
                const key = `${normalizeAlbum(r.album)}__${r.year}`;
                if (!dedupe.has(key)) dedupe.set(key, { ...r, source: "todo" });
            });

            const known = [...dedupe.values()].sort((a, b) => a.year - b.year);
            const libCount = known.filter((x) => x.source === "library").length;
            const todoCount = known.filter((x) => x.source === "todo").length;
            const knownDurationSeconds = known.reduce((sum, item) => {
                const parsed = parseLengthToSeconds(item.length);
                return parsed === null ? sum : sum + parsed;
            }, 0);
            const listenedDurationSeconds = known.reduce((sum, item) => {
                if (item.source !== "library") return sum;
                const parsed = parseLengthToSeconds(item.length);
                return parsed === null ? sum : sum + parsed;
            }, 0);
            const storedTotal = parseInt(state.artistTotals[PHYLLOMEDUSA_ARTIST], 10);
            const totalAlbumsCount = Number.isFinite(storedTotal) && storedTotal >= 0 ? storedTotal : 0;
            const missingCount = totalAlbumsCount > 0 ? Math.max(0, totalAlbumsCount - known.length) : 0;
            const isIncomplete = totalAlbumsCount === 0 || todoCount > 0 || missingCount > 0;

            state.entry = {
                artist: PHYLLOMEDUSA_ARTIST,
                known,
                libCount,
                todoCount,
                totalAlbumsCount,
                missingCount,
                isIncomplete,
                knownDurationSeconds,
                listenedDurationSeconds
            };
        }

        function blockTitle(block, idx) {
            if (block.source === "library") return `${idx + 1}. ${block.album || "Unknown"} (${block.year === 99999 ? "?" : block.year}) [Library]`;
            if (block.source === "todo") return `${idx + 1}. ${block.album || "Unknown"} (${block.year === 99999 ? "?" : block.year}) [ToDo]`;
            return `${idx + 1}. Missing album`;
        }

        function goToTodoAdd(artist) {
            const params = new URLSearchParams();
            params.set("page", "todo");
            params.set("openAddTodo", "1");
            params.set("artist", artist);
            window.location.href = `./index.html?${params.toString()}`;
        }

        function goToLibraryAlbum(artist, album) {
            const params = new URLSearchParams();
            params.set("page", "library");
            params.set("libraryArtist", artist || "");
            params.set("libraryAlbum", album || "");
            window.location.href = `./index.html?${params.toString()}`;
        }

        function goToTodoAlbum(artist, album) {
            const params = new URLSearchParams();
            params.set("page", "todo");
            params.set("todoQuery", `${artist} ${album}`.trim());
            window.location.href = `./index.html?${params.toString()}`;
        }

        async function saveArtistTotal(artist, value) {
            const n = parseInt(String(value || "").trim(), 10);
            if (!Number.isFinite(n) || n < 0) {
                alert("Total albums must be a non-negative number.");
                return;
            }

            const nextTotals = { ...(state.artistTotals || {}) };
            nextTotals[artist] = n;

            try {
                const payload = {
                    albums: state.albums,
                    todos: state.todos,
                    artistTotals: nextTotals
                };
                await setDoc(doc(db, "data", "library"), payload, { merge: true });
                state.artistTotals = nextTotals;
                buildEntry();
                render();
            } catch (e) {
                console.error(e);
                alert("Could not save total albums count.");
            }
        }

        function render() {
            const g = state.entry;
            if (!g) {
                root.innerHTML = '<div class="row muted">No data found.</div>';
                return;
            }

            const completionPct = g.totalAlbumsCount > 0 ? Math.min(100, Math.round((g.libCount / g.totalAlbumsCount) * 100)) : 0;

            metaLine.innerHTML = `Artist: <strong>${g.artist}</strong> | <span class="ok">Library: ${g.libCount}</span> | <span class="danger">ToDo: ${g.todoCount}</span> | <span class="danger">Missing: ${g.missingCount}</span> | Total: <strong>${g.totalAlbumsCount}</strong> | Completion: <strong class="completion-counter">${completionPct}%</strong>`;

            const blocks = [];
            g.known.forEach((k, i) => {
                const cls = k.source === "library" ? "library" : "todo";
                const coverStyle = k.coverUrl
                    ? `style="background-image: linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)), url('${k.coverUrl.replace(/'/g, "%27")}');"`
                    : "";
                blocks.push(`<div class="block ${cls} clickable" data-source="${k.source}" data-artist="${encodeURIComponent(g.artist)}" data-album="${encodeURIComponent(k.album || "")}" title="${blockTitle(k, i)}" ${coverStyle}><span class="block-index">${i + 1}</span></div>`);
            });
            for (let i = 0; i < g.missingCount; i++) {
                const idx = g.known.length + i;
                blocks.push(`<div class="block missing" data-artist="${encodeURIComponent(g.artist)}" title="${blockTitle({ source: "missing" }, idx)}"><span class="block-index">${idx + 1}</span><span class="block-symbol">?</span></div>`);
            }

            root.innerHTML = `
                <div class="row">
                    <div class="row-head">
                        <div>
                            <div class="artist">${g.artist} (${g.totalAlbumsCount} albums)</div>
                            <div class="artist-meta">Time (listened / known): <strong>${formatDuration(g.listenedDurationSeconds)} / ${formatDuration(g.knownDurationSeconds)}</strong></div>
                            <div class="artist-meta">Library: ${g.libCount} | ToDo: ${g.todoCount} | Missing: ${g.missingCount} | Status: ${g.isIncomplete ? '<span class="danger">Incomplete</span>' : '<span class="ok">Complete</span>'}</div>
                        </div>
                        <div class="totals-edit">
                            <span>Total albums:</span>
                            <input type="number" min="0" value="${g.totalAlbumsCount}" id="phylloTotalInput">
                            <button class="save-mini" id="btnSaveTotal">Save</button>
                        </div>
                    </div>
                    <div class="blocks">${blocks.join("")}</div>
                </div>`;

            root.querySelectorAll(".block.missing").forEach((el) => {
                el.addEventListener("click", () => {
                    const artist = decodeURIComponent(el.getAttribute("data-artist") || "");
                    goToTodoAdd(artist);
                });
            });

            root.querySelectorAll(".block.clickable").forEach((el) => {
                el.addEventListener("click", () => {
                    const source = el.getAttribute("data-source") || "";
                    const artist = decodeURIComponent(el.getAttribute("data-artist") || "");
                    const album = decodeURIComponent(el.getAttribute("data-album") || "");
                    if (source === "todo") goToTodoAlbum(artist, album);
                    else goToLibraryAlbum(artist, album);
                });
            });

            const saveBtn = document.getElementById("btnSaveTotal");
            if (saveBtn) {
                saveBtn.addEventListener("click", () => {
                    const input = document.getElementById("phylloTotalInput");
                    saveArtistTotal(PHYLLOMEDUSA_ARTIST, input ? input.value : "");
                });
            }
        }

        document.getElementById("btnBackDiscog").addEventListener("click", () => {
            window.location.href = "./discography.html";
        });

        document.getElementById("btnBackApp").addEventListener("click", () => {
            window.location.href = "./index.html";
        });

        document.getElementById("btnReload").addEventListener("click", () => {
            loadData();
        });

        loadData();
    </script>
</body>
</html>
